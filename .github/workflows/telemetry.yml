name: Refresh profile telemetry

on:
  schedule:
    - cron: "41 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/render_telemetry.py"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Render telemetry from GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_telemetry.py

      - name: Commit refreshed telemetry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/telemetry.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile telemetry"
          git push
